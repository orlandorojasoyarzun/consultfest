# Railway build configuration.
#
# Railway's Nixpacks Laravel preset installs PHP 8.3 by default, but our
# composer.lock requires PHP 8.4+ (symfony/* v8.1). We override ALL phases
# explicitly so the preset doesn't merge its own PHP into PATH first.
#
# Setup: PHP 8.4 + composer + Node 20 (no default `php`, no default nodejs).
# Install: composer install (no --no-dev in case we need dev deps for npm build).
# Build: npm install + npm run build (Tailwind/Vite frontend).
# Start: migrate + cache + serve. $PORT is provided by Railway.

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-interaction --optimize-autoloader --prefer-dist"]

[phases.build]
cmds = ["npm ci", "npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
